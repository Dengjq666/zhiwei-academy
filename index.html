      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  /* ==========================================================
     二、本地存储（含旧版数据迁移）
     ========================================================== */
  var KEY_P = "zww:progress";
  var KEY_W = "zww:wrongbook";

  var store = {
    getProgress: function () {
      try {
        var p = JSON.parse(localStorage.getItem(KEY_P));
        return p && typeof p === "object" ? p : {};
      } catch (e) { return {}; }
    },
    saveProgress: function (p) {
      try { localStorage.setItem(KEY_P, JSON.stringify(p)); } catch (e) {}
    },
    getWrong: function () {
      try {
        var w = JSON.parse(localStorage.getItem(KEY_W));
        return w && typeof w === "object" ? w : {};
      } catch (e) { return {}; }
    },
    saveWrong: function (w) {
      try { localStorage.setItem(KEY_W, JSON.stringify(w)); } catch (e) {}
    },
    /* 旧版本只存 qid，缺 id 字段，会导致重做时无法定位题目 */
    migrate: function () {
      var w = this.getWrong(), changed = false;
      Object.keys(w).forEach(function (qid) {
        var it = w[qid];
        if (!it || typeof it !== "object") { delete w[qid]; changed = true; return; }
        if (!it.id) { it.id = qid; changed = true; }
        if (!it.chId) { it.chId = String(qid).split("-")[0]; changed = true; }
        if (!it.type) { it.type = "choice"; changed = true; }
        it.wrongCount = it.wrongCount || 1;
      });
      /* 章节数据若已调整，清掉指向不存在题目的记录 */
      Object.keys(w).forEach(function (qid) {
        if (!Q_INDEX[qid] && !CHAPTERS[String(qid).split("-")[0]]) { delete w[qid]; changed = true; }
      });
      if (changed) this.saveWrong(w);
      return w;
    },
    clearAll: function () {
      try { localStorage.removeItem(KEY_P); localStorage.removeItem(KEY_W); } catch (e) {}
    }
  };

  /* ==========================================================
     三、进度与统计
     ========================================================== */
  function chapterQuestions(cid) {
    var c = CHAPTERS[cid], out = [];
    if (!c || !c.quizzes) return out;
    ["choice", "judge", "blank"].forEach(function (t) {
      (c.quizzes[t] || []).forEach(function (q) { out.push(q); });
    });
    return out;
  }
  function countQuizzes(c) {
    if (!c || !c.quizzes) return 0;
    return (c.quizzes.choice || []).length + (c.quizzes.judge || []).length + (c.quizzes.blank || []).length;
  }
  function isDone(qid) {
    var p = store.getProgress();
    var r = p[String(qid).split("-")[0]];
    return !!(r && r.done && r.done.indexOf(qid) !== -1);
  }
  function markDone(qid) {
    var p = store.getProgress();
    var cid = String(qid).split("-")[0];
    var rec = p[cid] || { opened: true, lastVisit: 0, done: [] };
    if (!rec.done) rec.done = [];
    if (rec.done.indexOf(qid) === -1) rec.done.push(qid);
    rec.opened = true; rec.lastVisit = Date.now();
    p[cid] = rec;
    store.saveProgress(p);
  }
  function undoDone(qid) {
    var p = store.getProgress();
    var cid = String(qid).split("-")[0];
    var rec = p[cid];
    if (rec && rec.done) {
      var i = rec.done.indexOf(qid);
      if (i !== -1) { rec.done.splice(i, 1); store.saveProgress(p); }
    }
  }
  /* 只统计当前题库里仍存在的题，避免历史数据把进度算成 >100% */
  function chStats(cid) {
    var list = chapterQuestions(cid);
    var p = store.getProgress();
    var rec = p[cid];
    var doneIds = (rec && rec.done) || [];
    var done = 0;
    for (var i = 0; i < list.length; i++) { if (doneIds.indexOf(list[i].id) !== -1) done++; }
    return { total: list.length, done: done, pct: list.length ? Math.round(done / list.length * 100) : 0 };
  }
  function overallStats() {
    var total = 0, done = 0;
    ORDER.forEach(function (cid) {
      var s = chStats(cid); total += s.total; done += s.done;
    });
    return { total: total, done: done, pct: total ? Math.round(done / total * 100) : 0 };
  }
  function wrongStats() {
    var w = store.getWrong(), ids = Object.keys(w), chs = {}, heavy = 0;
    ids.forEach(function (id) {
      var it = w[id] || {};
      var cid = it.chId || String(id).split("-")[0];
      chs[cid] = 1;
      if ((it.wrongCount || 0) >= 2) heavy++;
    });
    return { count: ids.length, chapters: Object.keys(chs).length, heavy: heavy };
  }

  /* ==========================================================
     四、判分
     ========================================================== */
  var FW_MAP = {
    "０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9",
    "．": ".", "（": "(", "）": ")", "，": ",", "－": "-", "﹣": "-", "＝": "=", "＋": "+",
    "×": "*", "÷": "/", "　": "", "：": ":", "；": ";", "％": "%", "。": ""
  };
  function normalizeAnswer(s) {
    if (s == null) return "";
    var out = String(s).replace(/\s+/g, "");
    out = out.replace(/[０-９．（），－﹣＝＋×÷　：；％。]/g, function (ch) { return FW_MAP[ch] || ch; });
    return out.toLowerCase();
  }
  function gradeBlank(q, raw) {
    var n = normalizeAnswer(raw);
    if (!n) return false;
    var accepts = (q.accept || []).map(normalizeAnswer);
    for (var i = 0; i < accepts.length; i++) { if (accepts[i] === n) return true; }
    var v = parseFloat(n);
    if (!isNaN(v)) {
      var tol = (q.tol == null) ? 1e-3 : Math.abs(q.tol);
      for (var j = 0; j < accepts.length; j++) {
        var av = parseFloat(accepts[j]);
        if (!isNaN(av) && Math.abs(v - av) <= tol) return true;
      }
    }
    return false;
  }
  function grade(q, userAns) {
    if (q.type === "blank") return gradeBlank(q, userAns);
    return String(userAns).toUpperCase() === String(q.answer).toUpperCase();
  }
  function answerText(q) {
    if (q.type === "blank") return (q.accept || []).slice(0, 3).join(" 或 ");
    if (q.type === "judge") return q.answer === "T" ? "正确" : "错误";
    return String(q.answer || "");
  }

  /* ==========================================================
     五、公式渲染（KaTeX 就绪后再渲染，避免白屏）
     ========================================================== */
  var pendingMath = [];
  function renderMath(el) {
    if (!el) return;
    if (!window.renderMathInElement) { pendingMath.push(el); return; }
    try {
      window.renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false,
        strict: false,
        errorColor: "#A9382C"
      });
    } catch (e) { /* 单块公式异常不影响整页 */ }
  }
  function flushMath() {
    if (!window.renderMathInElement) return;
    var list = pendingMath; pendingMath = [];
    list.forEach(function (el) { if (el && el.isConnected) renderMath(el); });
  }
  window.addEventListener("load", flushMath);
  /* KaTeX 只提供 katex.render，auto-render 缺失时做一次降级：不渲染但不报错 */

  /* ==========================================================
     六、渲染：通用片段
     ========================================================== */
  function shortId(qid) {
    var m = String(qid).match(/-q(\d+)$/);
    return m ? "Q" + m[1] : String(qid);
  }

  function feedbackHTML(q, st) {
    /* st: {phase:'done'|'right'|'wrong', pick} */
    if (!st) return "";
    var cls = st.phase === "wrong" ? "wrong" : "right";
    var tag = st.phase === "done" ? "已掌握" : (st.phase === "right" ? "回答正确" : "回答错误");
    var h = '<div class="feedback feedback--' + cls + '" data-fb>' +
      '<span class="feedback__tag">' + tag + "</span>" +
      '<span class="feedback__ans">正确答案：' + esc(answerText(q)) + "</span><br>" +
      esc(q.analysis || "暂无解析。") +
      "</div>";
    h += '<div class="feedback__actions">' +
      '<button type="button" class="linkbtn js-retry" data-qid="' + esc(q.id) + '">再做一次</button>' +
      "</div>";
    return h;
  }

  function optionsOf(q) {
    if (q.type === "judge") return [["T", "正确", "√"], ["F", "错误", "×"]];
    return (q.options || []).map(function (op, i) { return [LETTERS[i], op, LETTERS[i]]; });
  }

  function quizHTML(q, opt) {
    opt = opt || {};
    var done = isDone(q.id);
    var s = SESS[q.id];
    var st = done ? { phase: "done" } : (s ? { phase: s.ok ? "right" : "wrong", pick: s.pick } : null);
    var stateCls = st ? (st.phase === "wrong" ? " is-wrong" : " is-right") : "";
    var h = '<article class="qcard' + stateCls + '" data-qid="' + esc(q.id) + '" data-type="' + esc(q.type) +
      '" data-tier="' + esc(q.tier || "mid") + '">';

    h += '<div class="qcard__head"><span class="qcard__id">' + esc(shortId(q.id)) + "</span>" +
      '<span class="badge ' + esc(q.tier || "mid") + '">' + esc(TIER_LABEL[q.tier] || "提高") + "</span>";
    if (st) {
      h += '<span class="qcard__done">' + (st.phase === "wrong" ? "✗ 待巩固" : "✓ 已掌握") + "</span>";
    } else if (opt.chapterLabel) {
      h += '<span class="qcard__done" style="color:var(--ink-3)">' + esc(opt.chapterLabel) + "</span>";
    }
    h += "</div>";

    h += '<div class="qcard__stem">' + esc(q.stem) + "</div>";

    if (q.type === "choice" || q.type === "judge") {
      h += '<div class="opts">';
      optionsOf(q).forEach(function (pair) {
        var letter = pair[0], text = pair[1], key = pair[2];
        var cls = "opt", mark = "";
        if (st) {
          if (letter === q.answer) { cls += " opt--right"; mark = "✓"; }
          else if (st.pick && String(st.pick).toUpperCase() === letter) { cls += " opt--wrong"; mark = "✗"; }
          else { cls += " opt--dim"; }
        }
        h += '<button type="button" class="' + cls + '" data-letter="' + esc(letter) + '"' +
          (st ? " disabled" : "") + ' aria-label="选项 ' + esc(key) + '">' +
          '<span class="opt__k">' + esc(key) + '</span>' +
          '<span class="opt__t">' + esc(text) + '</span>' +
          '<span class="opt__mark" aria-hidden="true">' + mark + "</span></button>";
      });
      h += "</div>";
    } else {
      h += '<div class="blank">' +
        '<input type="text" class="js-blank-input" autocomplete="off" spellcheck="false" ' +
        'aria-label="填空作答" placeholder="输入答案后按回车提交"' + (st ? " disabled" : "") + ">" +
        '<button type="button" class="btn btn--sm js-blank-submit"' + (st ? " disabled" : "") + ">提交</button>" +
        "</div>";
    }

    h += feedbackHTML(q, st);
    if (opt.removable) {
      h += '<div class="feedback__actions"><button type="button" class="linkbtn linkbtn--danger js-unwrong" data-qid="' +
        esc(q.id) + '">从错题本移除</button></div>';
    }
    return h + "</article>";
  }

  function mapHTML(map) {
    if (!map || !map.nodes || !map.nodes.length) return "";
    var h = '<div class="map" role="list">';
    map.nodes.forEach(function (n, i) {
      if (i > 0) {
        var label = "→";
        (map.edges || []).forEach(function (ed) {
          if (ed.from === map.nodes[i - 1].id && ed.to === n.id && ed.label) label = ed.label;
        });
        h += '<div class="map__edge" aria-hidden="true"><span>' + esc(label) + "</span><i>›</i></div>";
      }
      h += '<div class="map__node" role="listitem"><span class="map__idx" aria-hidden="true">' + (i + 1) + "</span>" +
        '<div class="map__lab">' + esc(n.label) +
        '</div><div class="map__hint">' + esc(n.hint) + "</div></div>";
    });
    return h + "</div>";
  }

  function blockHTML(b) {
    switch (b.kind) {
      case "p":
        return '<div class="block"><p>' + esc(b.text) + "</p></div>";

      case "concept":
        return '<div class="block block--concept"><h3>' + esc(b.title) + "</h3><p>" + esc(b.text) + "</p>" +
          (b.points && b.points.length
            ? "<ul>" + b.points.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
            : "") + "</div>";

      case "theorem":
        return '<div class="block block--theorem"><h3>' + esc(b.title) + "</h3><p>" + esc(b.text) + "</p>" +
          (b.tex ? "<p>$$" + esc(b.tex) + "$$</p>" : "") + "</div>";

      case "formula":
        return '<div class="block block--formula"><h3>' + esc(b.title) + "</h3>" +
          (b.tex ? "<p>$$" + esc(b.tex) + "$$</p>" : "") +
          (b.note ? '<div class="note">' + esc(b.note) + "</div>" : "") + "</div>";

      case "derive":
        return '<div class="block block--derive"><h3>' + esc(b.title) + "</h3>" +

              '<div class="step__body"><div>' + (s.tex ? "$$" + esc(s.tex) + "$$" : esc(s.text || "")) + "</div>" +
              (s.note ? '<div class="note">' + esc(s.note) + "</div>" : "") + "</div></div>";
          }).join("") + "</div>";

      case "epsdelta":
        return '<div class="block block--eps"><h3>' + esc(b.title) + "</h3>" +
          (b.statement ? '<p class="stm">' + esc(b.statement) + "</p>" : "") +

          }).join("") + "</div>";

        return '<div class="block block--callout"><h3>' + esc(b.title) + "</h3><p>" + esc(b.text) + "</p></div>";
    }
    return "";
  }

  function exampleHTML(ex, i) {

    "</header>";

    if (c.map) {
      h += '<section class="section section--tight"><h2 class="h2">知识地图<small>MAP</small></h2>' + mapHTML(c.map) + "</section>";
    }

    h += '<section class="section"><h2 class="h2">知识精讲<small>NOTES</small></h2>';
    (c.sections || []).forEach(function (b) { h += blockHTML(b); });
    h += "</section>";

    if (c.examples && c.examples.length) {
      h += '<section class="section"><h2 class="h2">例题精讲<small>EXAMPLES</small></h2>';
      c.examples.forEach(function (ex, i) { h += exampleHTML(ex, i); });
      h += "</section>";
    }

    /* ---- 题库 ---- */
    var f = FILTER[cid] || "all";
    h += '<section class="section" id="quizBank"><h2 class="h2">分层题库<small>PRACTICE</small></h2>';
    h += '<div class="quizbar">' +
      '<span class="quizbar__label">难度</span>' +
      '<div class="seg" role="group" aria-label="按难度筛选">' +
      [["all", "全部", total], ["basic", "基础", countTier(c, "basic")], ["mid", "提高", countTier(c, "mid")], ["kaoyan", "考研", countTier(c, "kaoyan")]]
        .map(function (t) {
          return '<button type="button" data-filter="' + t[0] + '" aria-pressed="' + (f === t[0]) + '">' +
            t[1] + " " + t[2] + "</button>";
        }).join("") +
      "</div>" +
      '<span class="quizbar__count" data-quizcount>显示 ' + total + " / " + total + " 题</span>" +
      "</div>";

    h += '<div class="quiz-list" data-filter="' + f + '">';
    [["choice", "一、选择题"], ["judge", "二、判断题"], ["blank", "三、填空题"]].forEach(function (grp) {
      var list = c.quizzes[grp[0]] || [];
      if (!list.length) return;
      h += '<div class="quiz-group"><div class="tier-title">' + grp[1] + "</div>";
      list.forEach(function (q) { h += quizHTML(q); });
      h += "</div>";
    });
    h += "</div></section>";

    if (c.cases && c.cases.length) {
      h += '<section class="section"><h2 class="h2">经济与数模案例<small>CASES</small></h2>';
      c.cases.forEach(function (k) {
        h += '<div class="case"><h3>' + esc(k.title) + "</h3><p>" + esc(k.body) + "</p>" +
          (k.calc ? '<div class="case__calc">' + esc(k.calc) + "</div>" : "") + "</div>";
      });
      h += "</section>";
    }

    if (c.formulas && c.formulas.length) {
      h += '<section class="section"><h2 class="h2">本章公式速查<small>FORMULAS</small></h2>' +
        '<div class="hgroup__body">';
      c.formulas.forEach(function (fm) {
        h += '<div class="frow"><span class="frow__name">' + esc(fm.name) + "</span>" +
          '<span class="frow__tex">$$' + esc(fm.tex) + "$$</span></div>";
      });
      h += "</div></section>";
    }

    h += pagerHTML(cid);
    return h;
  }

  function countTier(c, tier) {
    var n = 0;
    ["choice", "judge", "blank"].forEach(function (t) {
      (c.quizzes[t] || []).forEach(function (q) { if ((q.tier || "mid") === tier) n++; });
    });
    return n;
  }

  function pagerHTML(cid) {
    var i = ORDER.indexOf(cid);
    var prev = i > 0 ? ORDER[i - 1] : null;
    var next = i < ORDER.length - 1 ? ORDER[i + 1] : null;
    var h = '<nav class="pager" aria-label="章节翻页">';
    h += prev
      ? '<a href="#/' + prev + '"><span>← 上一章</span><b>' + META[prev].numeral + " · " + esc(META[prev].title) + "</b></a>"
      : '<a class="is-muted" href="#/home"><span>已是第一章</span><b>返回首页</b></a>';
    h += next
      ? '<a class="next" href="#/' + next + '"><span>下一章 →</span><b>' + META[next].numeral + " · " + esc(META[next].title) + "</b></a>"
      : '<a class="next" href="#/handbook"><span>全章已毕</span><b>去公式手册复习</b></a>';
    return h + "</nav>";
  }

  /* ==========================================================
     九、渲染：公式手册 / 错题本
     ========================================================== */
  function handbookHTML() {
    var total = 0;
    ORDER.forEach(function (cid) {
      var c = CHAPTERS[cid]; if (c) total += (c.formulas || []).length;
    });

    var h = '<header class="tool-head">' +
      '<div class="ch-head__eyebrow">REFERENCE</div>' +
      "<h1>公式速查手册</h1>" +
      "<p>八章常用公式按章归类，可输入关键词检索（如“弹性”“积分因子”“sin”）。点击章名回到正文复习。</p>" +
      '<div class="search"><label class="sr-only" for="hbSearch">检索公式</label>' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="opacity:.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '<input id="hbSearch" type="search" placeholder="检索公式名称或符号…" autocomplete="off">' +
        '<span class="search__meta" id="hbCount">共 ' + total + " 条</span>" +
      "</div>" +
    "</header>";

    var any = false;
    ORDER.forEach(function (cid) {
      var c = CHAPTERS[cid];
      if (!c || !c.formulas || !c.formulas.length) return;
      any = true;
      h += '<section class="hgroup" data-cid="' + cid + '">' +
        '<div class="hgroup__title"><a href="#/' + cid + '">' + META[cid].numeral + " · " + esc(c.title) + "</a>" +
        '<span data-total="' + c.formulas.length + '">' + c.formulas.length + " 条</span></div>" +
        '<div class="hgroup__body">';
      c.formulas.forEach(function (fm) {
        var key = [fm.name, fm.tex, c.title].join(" ").toLowerCase();
        h += '<div class="frow" data-k="' + esc(key) + '">' +
          '<span class="frow__name">' + esc(fm.name) + "</span>" +
          '<span class="frow__tex">$$' + esc(fm.tex) + "$$</span></div>";
      });
      h += "</div></section>";
    });
    if (!any) {
      h += '<div class="empty"><div class="empty__seal">典</div><h2>手册校订中</h2><p>公式内容将随章节陆续上架。</p></div>';
    }
    h += '<div class="empty" id="hbEmpty" hidden><div class="empty__seal">无</div><h2>没有匹配的公式</h2>' +
      '<p>换个关键词试试，例如“导数”“积分”“期望”。</p></div>';
    return h;
  }

  function wrongbookHTML() {
    var w = store.getWrong();
    WRONG_INDEX = w;
    var ids = Object.keys(w);
    var ws = wrongStats();

    var h = '<header class="tool-head">' +
      '<div class="ch-head__eyebrow">REVIEW</div>' +
      "<h1>错题本</h1>" +
      "<p>答错即自动收录；在这里重做，做对后自动移出并计入章节进度。</p>" +
      '<div class="wb-stats"><span><b>' + ws.count + "</b>道待巩固</span>" +
        "<span><b>" + ws.chapters + "</b>个章节</span>" +
        "<span><b>" + ws.heavy + "</b>道重复做错</span></div>" +
    "</header>";

    if (!ids.length) {
      h += '<div class="empty"><div class="empty__seal">清</div><h2>错题本空空如也</h2>' +
        "<p>去分层题库里挑战一下，答错的题会自动记录在这里。</p>" +
        '<a class="btn" href="#/home">去看看八章导航</a></div>';
      return h;
    }

    h += '<div class="wb-toolbar">' +
      '<button type="button" class="btn btn--sm btn--danger" id="clearWrong">清空错题本</button>' +
      '<span class="wb-note">按章节归组，最近做错的排在前面</span>' +
    "</div>";

    /* 按章节归组 */
    var byCh = {};
    ids.forEach(function (qid) {
      var it = w[qid] || {};
      var cid = it.chId || String(qid).split("-")[0];
      (byCh[cid] = byCh[cid] || []).push(it);
    });

    ORDER.concat(Object.keys(byCh).filter(function (k) { return ORDER.indexOf(k) === -1; }))
      .forEach(function (cid) {
        var list = byCh[cid];
        if (!list || !list.length) return;
        list.sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });
        h += '<section class="section section--tight"><h2 class="h2">' +
          (META[cid] ? META[cid].numeral + " · " + esc(META[cid].title) : esc(cid)) +
          "<small>" + list.length + " 题</small></h2>";
        list.forEach(function (it) {
          var q = {
            id: it.id || it.qid, chId: cid, type: it.type || "choice", tier: it.tier || "mid",
            stem: it.stem, options: it.options, answer: it.answer,
            accept: it.accept, tol: it.tol, analysis: it.analysis
          };
          h += quizHTML(q, { removable: true });
        });
        h += "</section>";
      });

    return h;
  }

  /* ==========================================================
     十、视图调度
     ========================================================== */
  function parseHash() {
    var h = (location.hash || "").replace(/^#\/?/, "").replace(/\/$/, "");
    if (!h || h === "home") return "home";
    if (/^ch[1-8]$/.test(h)) return h;
    if (h === "handbook" || h === "wrongbook") return h;
    return "home";
  }

  var VIEW_TITLE = {
    home: "知微书院 · 经济数学八章通修",
    handbook: "公式速查手册 · 知微书院",
    wrongbook: "错题本 · 知微书院"
  };

  function renderView(view) {
    currentView = view;
    var el = $("main");
    var html;
    if (view === "home") html = homeHTML();
    else if (/^ch[1-8]$/.test(view)) html = chapterHTML(view);
    else if (view === "handbook") html = handbookHTML();
    else if (view === "wrongbook") html = wrongbookHTML();
    else html = homeHTML();

    el.innerHTML = html;
    renderMath(el);
    updateChrome();

    if (view === "handbook") {
      var input = $("hbSearch");
      if (input) {
        input.addEventListener("input", function () { filterHandbook(this.value); });
      }
    }
    applyFilter(currentView);
  }

  function route() {
    var view = parseHash();
    renderView(view);
    window.scrollTo(0, 0);
    try { $("main").focus({ preventScroll: true }); } catch (e) { $("main").focus(); }
    document.title = VIEW_TITLE[view] ||
      (META[view] ? "第" + (ORDER.indexOf(view) + 1) + "章 " + META[view].title + " · 知微书院" : VIEW_TITLE.home);
    closeSidebar();
  }

  /* ==========================================================
     十一、顶栏 / 侧栏 / 进度
     ========================================================== */
  function updateChrome() {
    var o = overallStats();
    var fill = $("progressFill"), label = $("progressLabel"), bar = $("progressBar");
    if (fill) fill.style.width = o.pct + "%";
    if (label) label.textContent = o.done + " / " + o.total;
    if (bar) bar.setAttribute("aria-valuenow", String(o.pct));

    var ws = wrongStats();
    var wc = $("wrongCount"), hint = $("wrongNavHint"), navW = $("navWrong");
    if (wc) wc.textContent = ws.count ? String(ws.count) : "";
    if (hint) hint.textContent = ws.count ? ws.count + " 道待巩固" : "尚未收录错题";
    if (navW) navW.classList.toggle("has-badge", ws.count > 0);

    var nav = $("chNav");
    if (nav) {
      nav.innerHTML = ORDER.map(function (cid) {
        var m = META[cid], c = CHAPTERS[cid], s = chStats(cid);
        var cls = "nav-item" + (currentView === cid ? " is-active" : "");
        return '<li><a class="' + cls + '" href="#/' + cid + '" data-nav="' + cid + '">' +
          '<span class="num">' + m.numeral + "</span>" +
          '<span class="nav-item__main"><b>' + esc(c ? c.title : m.title) + "</b>" +
          "<small>" + esc(m.anchor) + "</small>" +
          '<span class="nav-item__bar"><i style="width:' + s.pct + '%"></i></span></span>' +
          '<span class="nav-item__pct">' + (s.pct ? s.pct + "%" : "—") + "</span></a></li>";
      }).join("");
    }

    document.querySelectorAll("[data-nav]").forEach(function (a) {
      if (a.getAttribute("data-nav") === currentView) a.classList.add("is-active");
      else a.classList.remove("is-active");
      if (a.classList.contains("nav-item")) {
        if (a.getAttribute("data-nav") === currentView) a.setAttribute("aria-current", "page");
        else a.removeAttribute("aria-current");
      }
    });
  }

  function refreshChapterMeter(cid) {
    if (currentView !== cid) return;
    var s = chStats(cid);
    var meter = document.querySelector(".ch-head__meter .track");
    if (meter) {
      meter.setAttribute("aria-valuenow", String(s.pct));
      var i = meter.querySelector("i"); if (i) i.style.width = s.pct + "%";
      var txt = document.querySelector("[data-meter-txt]");
      if (txt) txt.innerHTML = "已掌握 <b>" + s.done + "</b> / " + s.total + " 题";
    }
  }

  /* ==========================================================
     十二、作答交互（原地更新，不整页重绘）
     ========================================================== */
  function toast(msg) {
    var t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  function setCardState(q, pick, ok) {
    if (ok) {
      markDone(q.id);
      if (store.getWrong()[q.id]) {
        var w = store.getWrong(); delete w[q.id]; store.saveWrong(w);
      }
      SESS[q.id] = { pick: pick, ok: true };
    } else {
      var w2 = store.getWrong();
      var prev = w2[q.id];
      w2[q.id] = {
        id: q.id, qid: q.id, chId: q.chId || String(q.id).split("-")[0],
        type: q.type, tier: q.tier || "mid", stem: q.stem,
        options: q.options || null, answer: q.answer || null,
        accept: q.accept || null, tol: (q.tol == null ? null : q.tol),
        analysis: q.analysis || "",
        wrongCount: (prev && prev.wrongCount ? prev.wrongCount : 0) + 1,
        addedAt: Date.now()
      };
      store.saveWrong(w2);
      SESS[q.id] = { pick: pick, ok: false };
    }
  }

  function paintCard(card, q, pick, ok) {
    var st = { phase: ok ? "right" : "wrong", pick: pick };
    card.classList.toggle("is-right", ok);
    card.classList.toggle("is-wrong", !ok);

    var head = card.querySelector(".qcard__head");
    var old = head.querySelector(".qcard__done");
    if (old) old.remove();
    var doneTag = document.createElement("span");
    doneTag.className = "qcard__done";
    doneTag.textContent = ok ? "✓ 已掌握" : "✗ 待巩固";
    head.appendChild(doneTag);

    var opts = card.querySelectorAll(".opt");
    Array.prototype.forEach.call(opts, function (btn) {
      var letter = btn.getAttribute("data-letter");
      btn.setAttribute("disabled", "disabled");
      btn.classList.remove("opt--dim");
      if (letter === q.answer) {
        btn.classList.add("opt--right");
        var mk = btn.querySelector(".opt__mark"); if (mk) mk.textContent = "✓";
      } else if (pick != null && String(pick).toUpperCase() === letter) {
        btn.classList.add("opt--wrong");
        var mk2 = btn.querySelector(".opt__mark"); if (mk2) mk2.textContent = "✗";
      } else {
        btn.classList.add("opt--dim");
      }
    });

    var input = card.querySelector(".js-blank-input");
    var submit = card.querySelector(".js-blank-submit");
    if (input) input.disabled = true;
    if (submit) submit.disabled = true;

    var fb = card.querySelector("[data-fb]");
    if (fb) fb.remove();

    var wrap = document.createElement("div");
    wrap.innerHTML = feedbackHTML(q, st);
    var node = wrap.firstChild;          /* .feedback */
    var actions = wrap.lastChild;        /* .feedback__actions */

    var removable = card.querySelector(".js-unwrong");
    var anchor = removable ? removable.parentNode : null;
    if (anchor) {
      card.insertBefore(node, anchor);
      card.insertBefore(actions, anchor);
    } else {
      card.appendChild(node);
      card.appendChild(actions);
    }
    renderMath(node);
  }

  function reRenderCard(card, q) {
    var tmp = document.createElement("div");
    tmp.innerHTML = quizHTML(q, { removable: !!card.querySelector(".js-unwrong") });
    var fresh = tmp.firstChild;
    card.parentNode.replaceChild(fresh, card);
    renderMath(fresh);
  }

  function handleAnswer(card, q, pick, raw) {
    var ok = grade(q, raw == null ? pick : raw);
    setCardState(q, pick, ok);
    paintCard(card, q, pick, ok);
    updateChrome();
    refreshChapterMeter(q.chId || String(q.id).split("-")[0]);
    toast(ok ? "答对了，已计入进度" : "已收录进错题本");

    if (!ok) return;
    /* 错题本里答对：淡出移除该卡 */
    if (currentView === "wrongbook") {
      updateWrongbookAfterCorrect(card, q);
    }
  }

  function updateWrongbookAfterCorrect(card, q) {
    setTimeout(function () {
      if (!card.isConnected) return;
      card.style.transition = "opacity .25s, transform .25s";
      card.style.opacity = "0";
      card.style.transform = "translateY(-4px)";
      setTimeout(function () {
        var section = card.closest("section");
        card.remove();
        if (section && !section.querySelector(".qcard")) section.remove();
        var left = document.querySelectorAll("#main .qcard").length;
        if (!left) renderView("wrongbook");
        else updateChrome();
      }, 260);
    }, 900);
  }

  /* ==========================================================
     十三、难度筛选
     ========================================================== */
  function applyFilter(cid) {
    var list = document.querySelector(".quiz-list");
    if (!list) return;
    var f = FILTER[cid] || "all";
    list.setAttribute("data-filter", f);
    var shown = 0, total = 0;
    list.querySelectorAll(".qcard").forEach(function (card) {
      total++;
      var hide = f !== "all" && card.getAttribute("data-tier") !== f;
      card.hidden = hide;
      if (!hide) shown++;
    });
    list.querySelectorAll(".quiz-group").forEach(function (g) {
      var vis = g.querySelectorAll(".qcard:not([hidden])").length;
      g.hidden = vis === 0;
    });
    var counter = document.querySelector("[data-quizcount]");
    if (counter) counter.textContent = "显示 " + shown + " / " + total + " 题";
  }

  /* ==========================================================
     十四、公式手册检索
     ========================================================== */
  function filterHandbook(kw) {
    kw = String(kw || "").trim().toLowerCase();
    var groups = document.querySelectorAll(".hgroup");
    var total = 0;
    groups.forEach(function (g) {
      var vis = 0;
      g.querySelectorAll(".frow").forEach(function (row) {
        var k = (row.getAttribute("data-k") || "").toLowerCase();
        var hit = !kw || k.indexOf(kw) !== -1;
        row.hidden = !hit;
        if (hit) vis++;
      });
      g.hidden = vis === 0;
      total += vis;
      var lab = g.querySelector(".hgroup__title span");
      if (lab) {
        var all = lab.getAttribute("data-total") || "";
        lab.textContent = kw ? vis + " / " + all + " 条" : all + " 条";
      }
    });
    var c = $("hbCount");
    if (c) c.textContent = kw ? "命中 " + total + " 条" : "共 " + total + " 条";
    var empty = $("hbEmpty");
    if (empty) empty.hidden = total !== 0;
  }

  /* ==========================================================
     十五、侧栏与全局事件
     ========================================================== */
  function openSidebar() {
    var sb = $("sidebar"), sc = $("scrim"), bg = $("burger");
    sb.classList.add("open");
    sc.hidden = false;
    requestAnimationFrame(function () { sc.classList.add("show"); });
    bg.setAttribute("aria-expanded", "true");
    var first = sb.querySelector("a");
    if (first) first.focus({ preventScroll: true });
  }
  function closeSidebar() {
    var sb = $("sidebar"), sc = $("scrim"), bg = $("burger");
    if (!sb.classList.contains("open")) return;
    sb.classList.remove("open");
    sc.classList.remove("show");
    bg.setAttribute("aria-expanded", "false");
    setTimeout(function () { if (!sb.classList.contains("open")) sc.hidden = true; }, 320);
    /* 键盘用户关闭后焦点回到开关，避免焦点丢在隐藏区域 */
    if (sb.contains(document.activeElement)) { try { bg.focus({ preventScroll: true }); } catch (e) {} }
  }

  function confirmDo(msg) {
    try { return window.confirm(msg); } catch (e) { return false; }
  }

  function bindEvents() {
    var main = $("main");

    /* 点击：选项 / 提交 / 再做一次 / 移除 / 清空 / 筛选 */
    main.addEventListener("click", function (e) {
      var t = e.target;

      var opt = t.closest(".opt");
      if (opt && !opt.disabled) {
        var card = opt.closest(".qcard");
        var q = Q_INDEX[card.getAttribute("data-qid")] || WRONG_INDEX[card.getAttribute("data-qid")];
        if (q) handleAnswer(card, q, opt.getAttribute("data-letter"), null);
        return;
      }

      var sub = t.closest(".js-blank-submit");
      if (sub && !sub.disabled) {
        var card2 = sub.closest(".qcard");
        var input = card2.querySelector(".js-blank-input");
        var q2 = Q_INDEX[card2.getAttribute("data-qid")] || WRONG_INDEX[card2.getAttribute("data-qid")];
        if (q2) handleAnswer(card2, q2, input.value, input.value);
        return;
      }

      var retry = t.closest(".js-retry");
      if (retry) {
        var card3 = retry.closest(".qcard");
        var qid = card3.getAttribute("data-qid");
        var q3 = Q_INDEX[qid] || WRONG_INDEX[qid];
        delete SESS[qid];
        undoDone(qid);
        if (q3) reRenderCard(card3, q3);
        updateChrome();
        refreshChapterMeter(qid.split("-")[0]);
        return;
      }

      var un = t.closest(".js-unwrong");
      if (un) {
        var qid2 = un.getAttribute("data-qid");
        var w = store.getWrong();
        delete w[qid2];
        store.saveWrong(w);
        var c4 = un.closest(".qcard");
        var sec = c4.closest("section");
        c4.remove();
        if (sec && !sec.querySelector(".qcard")) sec.remove();
        if (!document.querySelector("#main .qcard")) renderView("wrongbook");
        else updateChrome();
        toast("已移出错题本");
        return;
      }

      var clr = t.closest("#clearWrong");
      if (clr) {
        if (confirmDo("确定清空错题本？此操作不可撤销。")) {
          store.saveWrong({});
          renderView("wrongbook");
          toast("错题本已清空");
        }
        return;
      }

      var fbtn = t.closest("[data-filter]");
      if (fbtn && fbtn.closest(".seg")) {
        FILTER[currentView] = fbtn.getAttribute("data-filter");
        document.querySelectorAll(".seg [data-filter]").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b === fbtn));
        });
        applyFilter(currentView);
        return;
      }
    });

    /* 填空回车提交 */
    main.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.classList && e.target.classList.contains("js-blank-input")) {
        e.preventDefault();
        var card = e.target.closest(".qcard");
        var sub = card && card.querySelector(".js-blank-submit");
        if (sub && !sub.disabled) sub.click();
      }
    });

    /* 跳转正文：只移动焦点，不改变 hash（否则会被路由当成首页） */
    var skip = document.querySelector(".skip-link");
    if (skip) skip.addEventListener("click", function (e) {
      e.preventDefault();
      var m = $("main");
      m.focus();
      m.scrollIntoView({ block: "start" });
    });

    /* 顶栏 / 侧栏 */
    $("burger").addEventListener("click", function () {
      if ($("sidebar").classList.contains("open")) closeSidebar(); else openSidebar();
    });
    $("scrim").addEventListener("click", closeSidebar);
    $("sidebar").addEventListener("click", function (e) {
      if (e.target.closest("a")) closeSidebar();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeSidebar();
    });

    var reset = $("resetProgress");
    if (reset) reset.addEventListener("click", function () {
      if (confirmDo("确定重置全部学习进度与错题本？此操作不可撤销。")) {
        store.clearAll();
        SESS = {};
        renderView(currentView);
        toast("学习进度已重置");
      }
    });

    /* 回到顶部 */
    var toTop = $("toTop");
    toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
    window.addEventListener("scroll", function () {
      toTop.classList.toggle("show", window.scrollY > 640);
    }, { passive: true });

    window.addEventListener("hashchange", route);
  }

  /* ==========================================================
     十六、启动
     ========================================================== */
  function buildIndex() {
    Q_INDEX = {};
    ORDER.forEach(function (cid) {
      var c = CHAPTERS[cid];
      if (!c || !c.quizzes) return;
      ["choice", "judge", "blank"].forEach(function (t) {
        (c.quizzes[t] || []).forEach(function (q) {
          q.type = t;
          q.chId = cid;
          Q_INDEX[q.id] = q;
        });
      });
    });
  }

  function boot() {
    buildIndex();
    store.migrate();
    WRONG_INDEX = store.getWrong();
    if (!location.hash) { try { history.replaceState(null, "", "#/home"); } catch (e) {} }
    bindEvents();
    route();
    var y = $("footYear"); if (y) y.textContent = new Date().getFullYear();
  }

  /* 对外接口（便于后续扩展 / 自动化检查） */
  window.ZW = {
    CHAPTERS: CHAPTERS,
    ORDER: ORDER,
    META: META,
    route: route,
    renderChapter: function (cid, el) { el.innerHTML = chapterHTML(cid); renderMath(el); },
    renderMath: renderMath,
    grade: function (q, ans) { return { ok: grade(q, ans), analysis: q.analysis || "" }; },
    gradeBlank: gradeBlank,
    normalizeAnswer: normalizeAnswer,
    store: store,
    overallPercent: function () { return overallStats().pct; },
    stats: function () { return { overall: overallStats(), wrong: wrongStats() }; }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
</html>
